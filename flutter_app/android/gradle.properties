org.gradle.jvmargs=-Xmx4096M -XX:MaxMetaspaceSize=1024m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true

org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=true
org.gradle.daemon=true

org.gradle.java.home=/Applications/Android Studio.app/Contents/jbr/Contents/Home

# Increase network timeouts for slow/unstable connections
systemProp.http.connectionTimeout=120000
systemProp.http.receiveTimeout=120000
systemProp.https.connectionTimeout=120000
systemProp.https.receiveTimeout=120000

# Fix SSL / No route to host issues
systemProp.gradle.internal.http.tlsVersion=TLSv1.2
systemProp.gradle.internal.repository.max.retries=5
systemProp.gradle.internal.repository.initial.backoff=2000

# macOS stability
org.gradle.vfs.watch=false
